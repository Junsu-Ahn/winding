<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold mb-6">마이페이지</h1>

  <!-- 마일리지 섹션 -->
  <section class="mb-8">
    <h2 class="text-2xl font-semibold mb-4">보유 마일리지</h2>
    <p>현재 마일리지: <span th:text="${#numbers.formatInteger(member.mileage, 0, 'COMMA')}"></span> 포인트</p>
  </section>

  <!-- 찜 목록 섹션 -->
  <section class="mb-8">
    <h2 class="text-2xl font-semibold mb-4">찜 목록</h2>
    <ul class="grid grid-cols-5 gap-6">
      <li th:each="product : ${member.wishlist}" class="bg-white p-4 shadow-md">
        <a th:href="@{/market/detail/{id}(id=${product.id})}">
          <img th:src="${product.thumbnailFilepath != null ? product.thumbnailFilepath : '/images/default.png'}" alt="상품 이미지" class="w-full h-40 object-cover mb-2">
          <h3 class="text-lg font-semibold mb-1" th:text="${product.name}">상품명</h3>
          <p class="text-gray-700 mb-2">₩<span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')}">가격</span></p>
        </a>
      </li>
    </ul>
    <!-- 찜 목록이 비어 있을 경우 -->
    <p th:if="${#lists.isEmpty(member.wishlist)}" class="text-center text-gray-500">찜한 상품이 없습니다.</p>
  </section>

  <!-- 장바구니 섹션 -->
  <section class="mb-8">
    <h2 class="text-2xl font-semibold mb-4">장바구니</h2>
    <ul class="grid grid-cols-5 gap-6">
      <li th:each="product : ${member.cart}" class="bg-white p-4 shadow-md">
        <a th:href="@{/market/detail/{id}(id=${product.id})}">
          <img th:src="${product.thumbnailFilepath != null ? product.thumbnailFilepath : '/images/default.png'}" alt="상품 이미지" class="w-full h-40 object-cover mb-2">
          <h3 class="text-lg font-semibold mb-1" th:text="${product.name}">상품명</h3>
          <p class="text-gray-700 mb-2">₩<span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')}">가격</span></p>
        </a>
      </li>
    </ul>
    <!-- 장바구니가 비어 있을 경우 -->
    <p th:if="${#lists.isEmpty(member.cart)}" class="text-center text-gray-500">장바구니에 담긴 상품이 없습니다.</p>
  </section>

  <!-- 회원 정보 수정, 비밀번호 변경, 회원 탈퇴 섹션 -->
  <section class="mb-8">
    <h2 class="text-2xl font-semibold mb-4">회원 정보</h2>

    <!-- 회원 정보 수정 버튼 -->
    <a href="/member/edit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">회원 정보 수정</a>

    <!-- 회원 탈퇴 버튼 -->
    <form id="deleteForm" action="/member/delete" method="post" class="inline-block ml-4" onsubmit="return confirmDeletion(event);">
      <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">회원 탈퇴</button>
    </form>
  </section>

</div>

<!-- 회원 탈퇴 확인 스크립트 -->
<script>
  function confirmDeletion(event) {
    event.preventDefault(); // 폼 제출을 일단 막습니다.

    // 사용자에게 탈퇴 확인 메시지와 입력을 요구합니다.
    const confirmation = prompt("회원탈퇴를 원하시면 '회원탈퇴'를 입력해주세요.");

    // 사용자가 '회원탈퇴'라고 정확히 입력했는지 확인합니다.
    if (confirmation === '회원탈퇴') {
      // 입력이 올바르면 폼을 제출합니다.
      document.getElementById('deleteForm').submit();
    } else {
      alert("회원 탈퇴가 취소되었습니다. 정확하게 '회원탈퇴'를 입력해주세요.");
    }

    return false;  // 기본 제출 방식을 막습니다.
  }
</script>

</body>
</html>
