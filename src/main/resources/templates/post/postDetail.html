<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Detail</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="/posts/css/postDetail.css">
    <!-- 네이버 지도 API 추가 -->
    <script th:src="'https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=' + ${naverClientId}"></script>
    <script src="/posts/js/Postjs/postDetail.js"></script>
</head>
<body>

<div class="container">
    <h1 class="title">
        <i class="icon">[Icon]</i>
        <span th:text="${post.title}">Post Title</span>
    </h1>

    <div class="info">
        <span class="date">Date: <span th:text="${formattedCreateDate}">2024-08-17</span></span>
        <span class="views">Views: <span th:text="${post.views}">123</span></span>
        <span class="author">Author: <span th:text="${post.author}">Author Name</span></span>
    </div>

    <div class="content">
        <h2>Content</h2>
        <p th:text="${post.description}"></p>
    </div>

    <!-- 지도 영역 -->
    <div id="map" class="map" th:data-departure-lat="${post.departureLat}"
         th:data-departure-lng="${post.departureLng}"
         th:data-destination-lat="${post.destinationLat}"
         th:data-destination-lng="${post.destinationLng}">
    </div>
</div>

</body>
</html>
