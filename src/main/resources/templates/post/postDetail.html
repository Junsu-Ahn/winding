<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Detail</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="css/postDetail.css">
    <script src="js/Postjs/postDetail.js"></script>
</head>
<body class="bg-gray-100 font-lato">

<div class="container mx-auto my-8 p-6 bg-white rounded-lg shadow-md">
    <h1 class="text-3xl font-bold text-gray-800 mb-4">
        <i class="fas fa-heading text-blue-500 mr-2"></i>
        <span th:text="${post.title}">Post Title</span>
    </h1>

    <div class="mb-4 text-gray-600">
        <i class="far fa-calendar-alt text-blue-500 mr-2"></i>
        <span>Date: </span><span th:text="${formattedCreateDate}">2024-08-17</span>
    </div>

    <div class="mb-4 text-gray-600">
        <i class="fas fa-eye text-blue-500 mr-2"></i>
        <span>Views: </span><span th:text="${post.views}">123</span>
    </div>

    <div class="mb-4 text-gray-600">
        <i class="fas fa-user text-blue-500 mr-2"></i>
        <span>Author: </span><span th:text="${post.author}">Author Name</span>
    </div>

    <div class="text-gray-800">
        <h2 class="text-2xl font-semibold mb-4">Content</h2>
        <p th:text="${post.description}">

        </p>
    </div>
</div>

</body>
</html>
