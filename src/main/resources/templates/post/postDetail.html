<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Detail</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" th:href="@{/posts/css/postDetail.css}">
    <!-- 네이버 지도 API 추가 -->
    <script th:src="'https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=' + ${naverClientId}"></script>
    <script th:src="@{/posts/js/Postjs/postDetail.js}"></script>

    <style>
        /* 지도 고정 스타일 */
        .map {
            position: fixed;
            top: 20px; /* 상단으로부터의 거리 */
            right: 20px; /* 우측으로부터의 거리 */
            width: 300px; /* 지도 너비 */
            height: 400px; /* 지도 높이 */
            z-index: 1000; /* 다른 요소들보다 위에 보이도록 설정 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .container {
            margin-right: 340px; /* 고정된 지도 공간만큼 컨테이너 오른쪽 여백 추가 */
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .images-grid img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .images-grid p {
            text-align: center;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title">
        <i class="icon">[Icon]</i>
        <span th:text="${post.title}">Post Title</span>
    </h1>

    <div class="info">
        <span class="date">Date: <span th:text="${formattedCreateDate}">2024-08-17</span></span>
        <span class="views">Views: <span th:text="${post.views}">123</span></span>
        <span class="author">Author: <span th:text="${post.author}">Author Name</span></span>
    </div>

    <!-- 썸네일 이미지 추가 -->
    <div class="thumbnail">
        <img th:src="@{${post.thumbnailFilepath}}" alt="썸네일 이미지" style="max-width:100%; height:auto;">
    </div>

    <div class="content">
        <h2>Content</h2>
        <p th:text="${post.description}">내용이 여기에 표시됩니다.</p>
    </div>

    <!-- 등록된 사진 출력 영역 -->
    <div class="images-section">
        <h3>등록된 사진들</h3>
        <div class="images-grid">
            <div th:each="image, iterStat : ${post.images}">
                <img th:src="@{${image.filepath}}" alt="등록된 이미지" style="max-width:100%; height:auto;">
                <p th:text="${post.additionalDescriptions[iterStat.index]}">이미지 설명</p>
            </div>
        </div>
    </div>

    <!-- 지도 영역 -->
    <div id="map" class="map"
         th:data-departure-lat="${post.departureLat != null ? post.departureLat : 0}"
         th:data-departure-lng="${post.departureLng != null ? post.departureLng : 0}"
         th:data-destination-lat="${post.destinationLat != null ? post.destinationLat : 0}"
         th:data-destination-lng="${post.destinationLng != null ? post.destinationLng : 0}"
         th:data-waypoint1-lat="${post.waypoint1Lat != null ? post.waypoint1Lat : 0}"
         th:data-waypoint1-lng="${post.waypoint1Lng != null ? post.waypoint1Lng : 0}"
         th:data-waypoint2-lat="${post.waypoint2Lat != null ? post.waypoint2Lat : 0}"
         th:data-waypoint2-lng="${post.waypoint2Lng != null ? post.waypoint2Lng : 0}"
         th:data-waypoint3-lat="${post.waypoint3Lat != null ? post.waypoint3Lat : 0}"
         th:data-waypoint3-lng="${post.waypoint3Lng != null ? post.waypoint3Lng : 0}">
    </div>
</div>

</body>
</html>
