<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>검색 결과</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/postList.css">
  <link rel="stylesheet" href="css/layout/layout.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/Postjs/postList.js"></script>
  <script src="js/layout/layout.js"></script>
</head>
<body>

<!-- 공통 상단 바 삽입 -->
<div th:insert="~{fragments/topbar :: topbar}"></div>

<!-- 검색 결과 섹션 -->
<div class="post_list_section">
  <h2>검색 결과: "<span th:text="${keyword}"></span>"</h2>

  <!-- 검색 결과가 없을 경우 메시지 -->
  <div th:if="${#lists.isEmpty(posts)}">
    <p>검색 결과가 없습니다.</p>
  </div>

  <!-- 검색 결과가 있을 경우 게시물 목록 -->
  <div class="post_grid" th:unless="${#lists.isEmpty(posts)}">
    <!-- 각 게시물 카드 -->
    <div class="post_card" th:each="post : ${posts}">
      <a th:href="@{/posts/detail/{id}(id=${post.id})}">
        <!-- 썸네일 이미지가 있을 때 표시 -->
        <img th:if="${post.thumbnail != null}" th:src="@{${post.thumbnail}}" alt="썸네일 이미지">
        <!-- 썸네일 이미지가 없을 때 기본 이미지 사용 -->
        <img th:unless="${post.thumbnail != null}" th:src="@{/images/default_thumbnail.jpg}" alt="기본 썸네일 이미지">
        <div class="post_info">
          <h3 th:text="${post.title}">게시글 제목</h3>
          <p>조회수: <span th:text="${post.views}">0</span></p>
        </div>
      </a>
    </div>
  </div>

</div>

</body>
</html>
