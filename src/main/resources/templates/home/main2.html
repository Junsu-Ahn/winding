<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Roll! Winding</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/mainPage.css">
    <link rel="stylesheet" href="css/layout/layout.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/mainjs/mainPage.js"></script>
    <script src="js/layout/layout.js"></script>
</head>
<body>

<!-- 공통 상단 바 삽입 -->
<div th:replace="fragments/topbar :: topbar"></div>

<!-- 본문 내용 -->
<div class="banner_section">
    <div class="slider">
        <div class="slide">
            <img src="https://github.com/user-attachments/assets/2b874986-5966-4d30-bf6f-875b3cb6bb87" alt="이미지 1">
        </div>
    </div>
</div>

<div class="admin_section">
    <a href="/admin" class="admin_link" sec:authorize="hasRole('ROLE_ADMIN')">관리자 페이지로 이동</a>
</div>

<div class="drive_section popular_drives">
    <h2>인기 드라이브 코스</h2>
    <ul class="drive_list">
        <li th:each="drive : ${popularDrives}">
            <a th:href="@{/posts/detail/{id}(id=${drive.id})}">
                <img th:src="${drive.thumbnailFilepath != null ? drive.thumbnailFilepath : 'https://github.com/user-attachments/assets/415b30b9-749d-47bd-b20d-e00b28414cc2'}" alt="드라이브 이미지">
                <div class="drive_info">
                    <h3 th:text="${drive.title}">코스 이름</h3>
                    <p class="drive_views">조회수: <span th:text="${drive.views}"></span></p>
                </div>
            </a>
        </li>
    </ul>
</div>

<div class="drive_section latest_drives">
    <h2>최신 드라이브 코스</h2>
    <ul class="drive_list">
        <li th:each="drive : ${latestDrives}">
            <a th:href="@{/posts/detail/{id}(id=${drive.id})}">
                <img th:src="${drive.thumbnailFilepath != null ? drive.thumbnailFilepath : 'https://github.com/user-attachments/assets/415b30b9-749d-47bd-b20d-e00b28414cc2'}" alt="드라이브 이미지">
                <div class="drive_info">
                    <h3 th:text="${drive.title}">코스 이름</h3>
                    <p class="drive_views">조회수: <span th:text="${drive.views}"></span></p>
                </div>
            </a>
        </li>
    </ul>
</div>

<!-- footer는 메인 페이지에만 포함 -->
<footer>
    <div class="foot_container">
        <div class="foo_div1">
            <span>(주) Winding</span> | <span>대표 : 안준수</span> | <span>사업자등록번호 : 000-00-00000</span>
            <p>주소 : 대전 서구 대덕대로 179 9층 (우)35230</p>
            <p>Copyright © Let's Roll! Winding Corp. All rights reserved.</p>
        </div>
        <div class="foo_div2">
            <div>Let's Roll! Winding</div>
            <div>
                <img src="https://github.com/user-attachments/assets/0ed94cc9-4dc5-4759-82e7-02aa94b53d9f">
                <img src="https://blog.kakaocdn.net/dn/UGS0q/btree5Viurw/l07AH1VgWJHm4stsAHLdL0/img.png">
                <img src="https://w7.pngwing.com/pngs/247/997/png-transparent-kakaotalk-hd-logo.png">
                <img src="https://media.rocketpunch.com/cache/2e/d5/2ed5970e32545f0b1d74beac75914e7b.jpg">
            </div>
        </div>
    </div>
</footer>

</body>
</html>
