<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Korea Map Buttons</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }
        .map-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: auto;
        }
        .map-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .map-button {
            position: absolute;
            border: 2px solid #fff;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            line-height: 30px;
            width: 60px;
            height: 30px;
        }
        #button1 {
    top: 18%;
    left: calc(60% - 60px);
}
#button2 {
    top: 18%;
    left: calc(40% - 60px);
}
#button3 {
    top: 36%;
    left: calc(40% - 60px);
}
#button4 {
    top: 33%;
    left: calc(55% - 60px);
}
#button5 {
    top: 48%;
    left: calc(45% - 60px);
}
#button6 {
    top: 60%;
    left: calc(40% - 60px);
}
#button7 {
    top: 58%;
    left: calc(65% - 60px);
}
#button8 {
    top: 40%;
    left: calc(70% - 60px);
}

        .guide-text {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="map-container">
    <img src="https://github.com/user-attachments/assets/cc38c20e-18b4-4283-9162-d5ffc52ba8af" alt="South Korea Map">
    <div class="guide-text">지역을 선택해 주세요</div>
    <button id="button1" class="map-button">강원도</button>
    <button id="button2" class="map-button">경기도</button>
    <button id="button3" class="map-button">충남</button>
    <button id="button4" class="map-button">충북</button>
    <button id="button5" class="map-button">전북</button>
    <button id="button6" class="map-button">전남</button>
    <button id="button7" class="map-button">경남</button>
    <button id="button8" class="map-button">경북</button>
</div>
</body>
</html>
