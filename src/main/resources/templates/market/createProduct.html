<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 등록</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div th:insert="~{market/layout :: layout}"></div>
  <!-- 상품 등록 폼 -->
<form action="/market/create" method="POST" enctype="multipart/form-data" class="bg-white p-6 shadow-md rounded">

<!-- 상품명 입력 -->
    <div class="mb-4">
      <label for="name" class="block text-gray-700">상품명</label>
      <input type="text" id="name" name="name" class="w-full border border-gray-300 p-2 rounded mt-1" placeholder="상품명을 입력하세요" required>
    </div>

    <!-- 가격 입력 -->
    <div class="mb-4">
      <label for="price" class="block text-gray-700">가격 (₩)</label>
      <input type="number" id="price" name="price" class="w-full border border-gray-300 p-2 rounded mt-1" placeholder="가격을 입력하세요" required>
    </div>

    <!-- 설명 입력 -->
    <div class="mb-4">
      <label for="description" class="block text-gray-700">상품 설명</label>
      <textarea id="description" name="description" class="w-full border border-gray-300 p-2 rounded mt-1" rows="4" placeholder="상품 설명을 입력하세요" required></textarea>
    </div>

    <!-- 이미지 업로드 -->
    <div class="mb-4">
        <label for="thumbnail" class="block text-gray-700">썸네일 이미지</label>
        <input type="file" id="thumbnail" name="thumbnail" class="w-full border border-gray-300 p-2 rounded mt-1" accept="image/*" required>
    </div>

    <div class="mb-4">
        <label for="images" class="block text-gray-700">추가 이미지 (선택 사항)</label>
        <input type="file" id="images" name="images" class="w-full border border-gray-300 p-2 rounded mt-1" accept="image/*" multiple>
    </div>

    <!-- 카테고리 선택 -->
    <div class="mb-4">
      <label for="category" class="block text-gray-700">카테고리</label>
      <select id="category" name="category" class="w-full border border-gray-300 p-2 rounded mt-1" required>
        <option value="" disabled selected>카테고리를 선택하세요</option>
        <option value="1">세차용품</option>
        <option value="2">엔진오일</option>
        <option value="3">워셔액</option>
        <option value="4">차량 관리용품</option>
        <option value="5">액세서리</option>
      </select>
    </div>

    <!-- 등록 버튼 -->
    <div class="mt-6">
      <button type="submit" class="w-full bg-blue-500 text-white p-3 rounded hover:bg-blue-600">상품 등록</button>
    </div>
  </form>

</body>
</html>
