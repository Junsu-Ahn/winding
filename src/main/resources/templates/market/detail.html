<!DOCTYPE html>
<html layout:decorate="~{/market/layout}">
<head>
  <title>상세정보</title>
</head>
<body>
<section layout:fragment="content" class="section-prod-list">
  <div class="container">
    <div class="card-header">
      상품 상세정보
    </div>
    <ul class="list-group list-group-flush gap-2">
      <li class="list-group-item">
        <img class="w-full max-w-[300px]" src="https://i.imgur.com/PVsCFy1.png" alt="상품이미지">
      </li>
      <li class="list-group-item">
        <span>번호 :</span>
        <span class="badge bg-primary">123</span>
      </li>
      <li class="list-group-item">
        <span>등록날짜 :</span>
        <span>123</span>
      </li>
      <li class="list-group-item">
        <span>수정날짜 :</span>
        <span>123</span>
      </li>
      <li class="list-group-item">
        <span>상품명 :</span>
        <span class="font-bold">123</span>
      </li>
      <li class="list-group-item">
        <span>가격 :</span>
        <span>1원</span>
      </li>
    </ul>
  </div>
</section>
</body>
</html>
