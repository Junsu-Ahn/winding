<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세정보</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // JavaScript로 수량 조절 및 총 금액 업데이트 기능 추가
    document.addEventListener('DOMContentLoaded', function () {
      const minusBtn = document.getElementById('minus-btn');
      const plusBtn = document.getElementById('plus-btn');
      const quantityInput = document.getElementById('quantity-input');
      const totalPriceEl = document.getElementById('total-price');
      const quantityTextEl = document.getElementById('quantity-text'); // 총 수량 요소
      const productPrice = parseInt(totalPriceEl.dataset.price.replace(/,/g, ''));  // 상품 가격을 숫자로 변환, 천단위 콤마 제거

      // 총 상품 금액 업데이트 함수
      function updateTotalPrice() {
        const quantity = parseInt(quantityInput.value);
        const totalPrice = productPrice * quantity;
        totalPriceEl.textContent = totalPrice.toLocaleString() + '₩';  // 천단위 콤마 추가
        quantityTextEl.textContent = quantity;  // 총 수량도 업데이트
      }

      // 수량 감소 버튼 클릭 이벤트
      minusBtn.addEventListener('click', function () {
        let currentQuantity = parseInt(quantityInput.value);
        if (currentQuantity > 1) {
          quantityInput.value = currentQuantity - 1;
          updateTotalPrice();
        }
      });

      // 수량 증가 버튼 클릭 이벤트
      plusBtn.addEventListener('click', function () {
        let currentQuantity = parseInt(quantityInput.value);
        quantityInput.value = currentQuantity + 1;
        updateTotalPrice();
      });

      // 페이지가 로드된 후 초기 총 상품 금액 설정
      updateTotalPrice();
    });

     // 찜하기 요청
function addToWishlist(productId) {
    const parsedProductId = parseInt(productId, 10);  // productId를 10진수로 변환
    fetch(`/market/wishlist/add/${parsedProductId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => {
        if (response.ok) {
            alert('상품이 찜 목록에 추가되었습니다.');
        } else {
            alert('찜 목록 추가 중 오류가 발생했습니다.');
        }
    })
    .catch(error => {
        console.error('Error:', error);
    });
}


    // 장바구니 요청
function addToCart(productId) {
    // 문자열로 전달된 productId를 정수로 변환
    const parsedProductId = parseInt(productId, 10);
    if (isNaN(parsedProductId)) {
        alert('잘못된 상품 ID입니다.');
        return;
    }

    fetch(`/market/cart/add/${parsedProductId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => {
        if (response.ok) {
            alert('상품이 장바구니에 추가되었습니다.');
        } else {
            alert('장바구니 추가 중 오류가 발생했습니다.');
        }
    })
    .catch(error => {
        console.error('Error:', error);
    });
}


  </script>
</head>
<body>
<!-- 내비게이션 바 -->
<nav class="bg-blue-900 py-4 mb-6">
  <div class="container mx-auto flex justify-center text-white space-x-40 px-20">
    <a href="#" class="hover:underline">마일리지 충전</a>
    <a href="#" class="hover:underline">마일리지 출금</a>
    <a href="#" class="hover:underline">중고 장터</a>
    <a href="/member/mypage" class="hover:underline">마이페이지</a>
  </div>
</nav>

<!-- 상품 상세 정보 컨테이너 -->
<div class="container mx-auto px-6 lg:px-32 py-10 bg-white shadow-md rounded-lg">
  <div class="flex flex-wrap">
    <!-- 왼쪽: 상품 이미지 (썸네일만 출력) -->
    <div class="w-full lg:w-1/2">
      <div class="border border-gray-200 p-4">
        <!-- 상품의 메인 이미지 (썸네일) -->
        <img id="main-image" th:src="@{${product.thumbnailFilepath}}" alt="상품 이미지" class="w-full mb-4">
      </div>
    </div>

    <!-- 오른쪽: 상품 정보 -->
    <div class="w-full lg:w-1/2 lg:pl-10 mt-6 lg:mt-0">
      <!-- 상품명 -->
      <h1 class="text-3xl font-bold mb-4" th:text="${product.name}">상품명</h1>

      <!-- 가격 -->
      <div class="mb-4">
        <h3 class="text-xl font-semibold">가격</h3>
        <p class="text-gray-700 mb-2">
          <span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')}"></span>₩
        </p>
      </div>

      <!-- 수량 조절 -->
      <div class="mb-6">
        <h3 class="text-xl font-semibold mb-2">수량</h3>
        <div class="flex items-center border border-gray-300 rounded w-32">
          <button id="minus-btn" class="w-10 h-10 bg-gray-200 hover:bg-gray-300 text-lg">-</button>
          <input id="quantity-input" type="text" value="1" class="w-12 h-10 text-center border-none outline-none" readonly>
          <button id="plus-btn" class="w-10 h-10 bg-gray-200 hover:bg-gray-300 text-lg">+</button>
        </div>
      </div>

      <!-- 총 상품 금액 -->
      <div class="mb-4">
        <p class="text-gray-700">총 상품 금액</p>
        <div class="flex items-center">
          <span class="text-lg font-semibold">총 수량 <span id="quantity-text">1</span>개 | </span>
          <span id="total-price" class="text-red-500 text-xl font-bold ml-2" th:data-price="${#numbers.formatInteger(product.price, 0, 'COMMA')}">상품 금액</span>
        </div>
      </div>

      <!-- 버튼 섹션 -->
      <div class="grid grid-cols-4 gap-4">
        <!-- 구매하기 버튼 -->
        <button class="col-span-2 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
          <span class="font-bold">구매하기</span>
        </button>

        <!-- 장바구니 버튼 -->
        <button class="col-span-1 bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-100"
                th:onclick="'addToCart(' + ${product.id} + ')'">
          장바구니
        </button>

        <!-- 찜하기 버튼 -->
        <button class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-100"
                th:onclick="'addToWishlist(' + ${product.id} + ')'">
          ❤ 찜하기
        </button>

        <!-- 뒤로가기 버튼 (목록으로) -->
        <a href="javascript:void(0);" onclick="history.back();" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-100">
          ⬅ 뒤로가기 (목록으로)
        </a>

      </div>
    </div>
  </div>

  <!-- 추가 이미지 및 설명 -->
  <div class="mt-8">
    <h3 class="text-2xl font-semibold mb-4">추가 이미지 및 설명</h3>

    <!-- 이미지가 있을 경우에만 출력 -->
    <div th:if="${product.images != null and !product.images.isEmpty()}">
      <div th:each="imagePath, iterStat : ${product.images}" class="flex flex-wrap justify-between items-start mb-8">
        <!-- 왼쪽: 이미지 출력, 크기를 절반으로 조정 -->
        <div class="w-full lg:w-1/2 mb-4">
          <div class="w-1/2 h-full flex items-start justify-center bg-transparent">
            <img th:src="@{${imagePath}}" alt="추가 이미지" class="w-full h-auto">
          </div>
        </div>

        <!-- 설명이 있을 경우에만 출력 -->
        <div th:if="${product.descriptions != null and !product.descriptions.isEmpty()}" class="w-full lg:w-1/2 mb-4">
          <div class="w-full h-full flex items-start justify-start bg-transparent">
            <!-- 인덱스를 사용해 설명을 동기화, 왼쪽 정렬 적용 -->
            <p th:text="${product.descriptions[iterStat.index]}" class="mb-2 text-gray-700 text-left"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- 설명만 있을 경우 출력 -->
    <div th:if="${product.images == null or product.images.isEmpty()} and ${product.descriptions != null and !product.descriptions.isEmpty()}">
      <div th:each="desc, iterStat : ${product.descriptions}" class="flex justify-start items-start mb-8">
        <!-- 오른쪽: 설명만 출력 -->
        <div class="w-full lg:w-1/2 mb-4">
          <p th:text="${desc}" class="mb-2 text-gray-700 text-left"></p>
        </div>
      </div>
    </div>

    <!-- 추가 이미지 및 설명이 모두 없을 경우 출력할 내용 -->
    <div th:if="${(product.images == null or product.images.isEmpty()) and (product.descriptions == null or product.descriptions.isEmpty())}" class="text-gray-500">
      <p>추가 이미지와 설명이 없습니다.</p>
    </div>
  </div>
</div>

</body>
</html>
