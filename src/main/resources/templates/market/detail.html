<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세정보</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // JavaScript로 수량 조절 및 총 금액 업데이트 기능 추가
    document.addEventListener('DOMContentLoaded', function () {
      const minusBtn = document.getElementById('minus-btn');
      const plusBtn = document.getElementById('plus-btn');
      const quantityInput = document.getElementById('quantity-input');
      const totalPriceEl = document.getElementById('total-price');
      const quantityTextEl = document.getElementById('quantity-text'); // 총 수량 요소
      const productPrice = parseInt(totalPriceEl.dataset.price.replace(/,/g, ''));  // 상품 가격을 숫자로 변환, 천단위 콤마 제거

      // 총 상품 금액 업데이트 함수
      function updateTotalPrice() {
        const quantity = parseInt(quantityInput.value);
        const totalPrice = productPrice * quantity;
        totalPriceEl.textContent = totalPrice.toLocaleString() + '₩';  // 천단위 콤마 추가
        quantityTextEl.textContent = quantity;  // 총 수량도 업데이트
      }

      // 수량 감소 버튼 클릭 이벤트
      minusBtn.addEventListener('click', function () {
        let currentQuantity = parseInt(quantityInput.value);
        if (currentQuantity > 1) {
          quantityInput.value = currentQuantity - 1;
          updateTotalPrice();
        }
      });

      // 수량 증가 버튼 클릭 이벤트
      plusBtn.addEventListener('click', function () {
        let currentQuantity = parseInt(quantityInput.value);
        quantityInput.value = currentQuantity + 1;
        updateTotalPrice();
      });

      // 페이지가 로드된 후 초기 총 상품 금액 설정
      updateTotalPrice();
    });

  </script>
</head>
<body>
<!-- 내비게이션 바 -->
<nav class="bg-blue-900 py-4 mb-6">
  <div class="container mx-auto flex justify-center text-white space-x-40 px-20">
    <a href="#" class="hover:underline">마일리지 충전</a>
    <a href="#" class="hover:underline">마일리지 출금</a>
    <a href="#" class="hover:underline">중고 장터</a>
    <a href="#" class="hover:underline">마이페이지</a>
  </div>
</nav>

<!-- 상품 상세 정보 컨테이너 -->
<div class="container mx-auto px-6 lg:px-32 py-10 bg-white shadow-md rounded-lg">
  <div class="flex flex-wrap">
    <!-- 왼쪽: 상품 이미지 (썸네일만 출력) -->
    <div class="w-full lg:w-1/2">
      <div class="border border-gray-200 p-4">
        <!-- 상품의 메인 이미지 (썸네일) -->
        <img id="main-image" th:src="@{${product.thumbnailFilepath}}" alt="상품 이미지" class="w-full mb-4">
      </div>
    </div>

    <!-- 오른쪽: 상품 정보 -->
    <div class="w-full lg:w-1/2 lg:pl-10 mt-6 lg:mt-0">
      <!-- 상품명 -->
      <h1 class="text-3xl font-bold mb-4" th:text="${product.name}">상품명</h1>

      <!-- 가격 -->
      <div class="mb-4">
        <h3 class="text-xl font-semibold">가격</h3>
        <p class="text-gray-700 mb-2">
          <span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')}"></span>₩
        </p>
      </div>

      <!-- 수량 조절 -->
      <div class="mb-6">
        <h3 class="text-xl font-semibold mb-2">수량</h3>
        <div class="flex items-center border border-gray-300 rounded w-32">
          <button id="minus-btn" class="w-10 h-10 bg-gray-200 hover:bg-gray-300 text-lg">-</button>
          <input id="quantity-input" type="text" value="1" class="w-12 h-10 text-center border-none outline-none" readonly>
          <button id="plus-btn" class="w-10 h-10 bg-gray-200 hover:bg-gray-300 text-lg">+</button>
        </div>
      </div>

      <!-- 총 상품 금액 -->
      <div class="mb-4">
        <p class="text-gray-700">총 상품 금액</p>
        <div class="flex items-center">
          <span class="text-lg font-semibold">총 수량 <span id="quantity-text">1</span>개 | </span>
          <span id="total-price" class="text-red-500 text-xl font-bold ml-2" th:data-price="${#numbers.formatInteger(product.price, 0, 'COMMA')}">상품 금액</span>
        </div>
      </div>

      <!-- 버튼 섹션 -->
      <div class="grid grid-cols-4 gap-4">
        <!-- 구매하기 버튼 -->
        <button class="col-span-2 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
          <span class="font-bold">구매하기</span>
        </button>

        <!-- 장바구니 버튼 -->
        <button class="col-span-1 bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-100">
          장바구니
        </button>
      </div>

      <!-- 찜하기 버튼 -->
      <div class="mt-4">
        <button class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-100">
          ❤ 찜하기
        </button>
      </div>
    </div>
  </div>

  <!-- 추가 이미지 및 설명 -->
  <div class="mt-8">
    <h3 class="text-2xl font-semibold mb-4">추가 이미지 및 설명</h3>
    <div class="flex flex-wrap justify-between items-start">
      <!-- 추가 이미지 출력 -->
      <div class="w-full lg:w-1/2 mb-4">
        <div th:each="imagePath : ${product.images}">
          <img th:src="@{${imagePath}}" alt="추가 이미지" class="w-full h-auto mb-4">
        </div>
      </div>
      <div class="w-full lg:w-1/2 mb-4">
        <div th:each="desc : ${product.descriptions}">
          <p th:text="${desc}" class="mb-2 text-gray-700"></p>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
