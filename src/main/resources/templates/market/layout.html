<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>test</title>

  <!-- 제이쿼리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

  <!-- 부트스트랩 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.min.js"></script>

  <!-- 테일윈드-->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">

  <!--    폰트어썸-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- common.css -->
  <link rel="stylesheet" href="/css/layout/common.css">
</head>

<body class="flex flex-col min-h-screen pt-[56px]">

<header>
  <!-- Fixed navbar -->
  <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-blue-900">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">COD 마켓</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
              aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="/">홈</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/product/list">강의리스트</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" sec:authorize="isAuthenticated()" href="/cart/list">장바구니</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" sec:authorize="isAnonymous()" th:href="@{/member/login}">로그인</a>
            <a class="nav-link" sec:authorize="isAuthenticated()" th:href="@{/member/logout}">로그아웃</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" sec:authorize="isAnonymous()" href="/member/join">회원가입</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" sec:authorize="hasAuthority('ADMIN')" href="/adm">관리자 홈</a>
          </li>
        </ul>
        <div class="text-white mr-5 mb-3 md:!mb-0" sec:authorize="isAuthenticated()" th:text="@{|${#authentication.name}님|}"></div>
        <form class="d-flex">
          <input class="form-control me-2" type="text" id="search_kw" th:value="${kw}" placeholder="상품명을 입력해주세요." aria-label="Search">
          <button class="btn btn-outline-light whitespace-nowrap" type="submit" id="btn_search">검색</button>
        </form>
      </div>
    </div>
  </nav>
</header>

<section class="flex-1 py-[20px] flex flex-col">
  <!-- Content Start -->
  <th:block layout:fragment="content"></th:block>
  <!-- Content End -->
</section>

<footer class="footer py-3 bg-light">
  <div class="container text-center">
    <span class="text-muted">COD 마켓</span>
  </div>
</footer>

</body>
</html>
