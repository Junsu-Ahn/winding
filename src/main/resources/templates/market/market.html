<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메인 페이지</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<!-- layout.html을 삽입 -->
<div th:insert="~{market/layout :: layout}"></div>
    <!-- 내비게이션 바 -->
    <nav class="bg-blue-900 py-4 mb-6">
      <div class="container mx-auto flex justify-center text-white space-x-40 px-20">
        <a href="#" class="hover:underline">마일리지 충전</a>
        <a href="#" class="hover:underline">마일리지 출금</a>
        <a href="#" class="hover:underline">중고 장터</a>
        <a href="#" class="hover:underline">마이페이지</a>
      </div>
    </nav>
<div class="container mx-auto px-32">
    <!-- 프로모션 배너 -->
    <section class="bg-blue-500 text-white py-6">
      <div class="container mx-auto text-center">
        <h1 class="text-2xl font-bold mb-2">자동차 용품 특별 할인 이벤트!</h1>
        <p class="mb-4">최대 50% 할인 혜택을 지금 바로 만나보세요!</p>
        <a href="#" class="bg-white text-blue-500 px-4 py-2 rounded">자세히 보기</a>
      </div>
    </section>

<section class="container mx-auto py-10">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">주요 카테고리</h2>
  <div class="grid grid-cols-5 gap-4">
    <div class="bg-white p-4 shadow-md text-center">
      <a th:href="@{/market/category/1}">
      <img src="https://github.com/user-attachments/assets/ded95445-952a-477d-8747-33ce6ea915b0" alt="세차용품" class="w-full h-40 object-cover mb-2">
        <h3 class="text-lg font-semibold">세차용품</h3>
      </a>
    </div>
    <div class="bg-white p-4 shadow-md text-center">
      <a th:href="@{/market/category/2}">
        <img src="https://github.com/user-attachments/assets/86850293-ad30-4500-975d-b89bc12230d1" alt="엔진오일" class="w-full h-40 object-cover mb-2">
        <h3 class="text-lg font-semibold">엔진오일</h3>
      </a>
    </div>
    <div class="bg-white p-4 shadow-md text-center">
      <a th:href="@{/market/category/3}">
        <img src="https://github.com/user-attachments/assets/c2e5e941-5b90-4fd0-b970-782f9568bf35" alt="워셔액" class="w-full h-40 object-cover mb-2">
        <h3 class="text-lg font-semibold">워셔액</h3>
      </a>
    </div>
    <div class="bg-white p-4 shadow-md text-center">
      <a th:href="@{/market/category/4}">
        <img src="https://github.com/user-attachments/assets/99936380-63e9-4c14-a5e5-dbabaa5f10ac" alt="차량 첨가제" class="w-full h-40 object-cover mb-2">
        <h3 class="text-lg font-semibold">차량 첨가제</h3>
      </a>
    </div>
    <div class="bg-white p-4 shadow-md text-center">
      <a th:href="@{/market/category/5}">
        <img src="https://github.com/user-attachments/assets/d8c5b336-a14e-43d4-a259-3b33f3a18f25" alt="액세서리" class="w-full h-40 object-cover mb-2">
        <h3 class="text-lg font-semibold">액세서리</h3>
      </a>
    </div>
  </div>
</section>

  <!-- 추천 상품 섹션 -->
  <section class="container mx-auto py-10">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">추천 상품</h2>
    <div class="grid grid-cols-5 gap-6">
      <!-- 상품이 없을 때 메시지 출력 -->
      <p th:if="${#lists.isEmpty(recommendedProducts)}">추천 상품이 없습니다.</p>

      <!-- 추천 상품 리스트 출력 -->
      <div th:each="product : ${recommendedProducts}" class="bg-white p-4 shadow-md text-center">
        <a th:href="@{/market/detail/{id}(id=${product.id})}">
          <img th:src="${product.thumbnailFilepath != null ? product.thumbnailFilepath : '/images/default.png'}" alt="추천 상품 이미지" class="w-full h-40 object-cover mb-2">
          <h3 class="text-lg font-semibold mb-1" th:text="${product.name}">상품명</h3>
          <p class="text-gray-700 mb-2">
            <span th:text="${formattedPrices[product.id]}+ ' '">가격</span>₩
          </p>
          <a th:href="@{/market/detail/{id}(id=${product.id})}" class="text-blue-500 hover:underline">자세히 보기</a>
        </a>
      </div>
    </div>
  </section>


    <!-- 최근 등록된 상품 섹션 -->
    <section class="container mx-auto py-10">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">최근 등록된 상품</h2>
      <ul class="grid grid-cols-5 gap-6">
        <li th:each="product : ${latestProducts}" class="bg-white p-4 shadow-md">
          <a th:href="@{/products/detail/{id}(id=${product.id})}">
            <img th:src="${product.thumbnailFilepath != null ? product.thumbnailFilepath : 'https://github.com/user-attachments/assets/415b30b9-749d-47bd-b20d-e00b28414cc2'}" alt="상품 이미지" class="w-full h-40 object-cover mb-2">
            <h3 class="text-lg font-semibold mb-1" th:text="${product.name}">상품명</h3>
            <p class="text-gray-700 mb-2">
              <span th:text="${formattedPrices[product.id]}+ ' '">가격</span>₩
            </p>
          </a>
        </li>
        <li th:if="${#lists.isEmpty(latestProducts)}">
          <p>최근 등록된 상품이 없습니다.</p>
        </li>
      </ul>
    </section>

  </div> <!-- pageContent 끝 -->
</div>
</body>
</html>
