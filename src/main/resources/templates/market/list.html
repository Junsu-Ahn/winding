<!DOCTYPE html>
<html layout:decorate="~{/market/layout}">
<section layout:fragment="content" class="container mx-auto py-10">
  <h2 class="text-2xl font-bold text-gray-800 mb-6" th:text="${categoryNumber == null ? '전체 상품' : '카테고리 ' + categoryNumber}"></h2>
  <div class="grid grid-cols-5 gap-4">
    <div class="bg-white p-4 shadow-md text-center" th:each="product : ${productList}">
      <a th:href="@{/market/detail/{id}(id=${product.id})}">
        <img th:src="${product.thumbnailFilepath}" alt="product image" class="w-full h-40 object-cover mb-2">
        <h3 class="text-lg font-semibold" th:text="${product.name}"></h3>
        <p th:text="'가격: ' + ${product.price} + '원'"></p>
      </a>
    </div>
  </div>
</section>
</html>
