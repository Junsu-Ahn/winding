<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>검색 결과</title>
  <!-- Tailwind CSS CDN 추가 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<!-- layout.html을 삽입 -->
<div th:replace="~{market/layout :: layout}"></div>

<section class="container mx-auto py-10">
  <!-- 검색 결과 제목 표시 -->
  <h2 class="text-2xl font-bold text-gray-800 mb-6" th:text="${keyword != null ? '검색 결과: ' + keyword : '상품 리스트'}">상품 리스트</h2>

  <!-- 검색 결과가 없을 경우 메시지 표시 -->
  <p th:if="${#lists.isEmpty(productList)}" class="text-center text-gray-500">검색 결과가 없습니다.</p>

  <!-- 상품 리스트 출력 -->
  <ul class="grid grid-cols-5 gap-6" th:if="${!#lists.isEmpty(productList)}">
    <li th:each="product : ${productList}" class="bg-white p-4 shadow-md">
      <a th:href="@{/market/detail/{id}(id=${product.id})}">
        <img th:src="${product.thumbnailFilepath != null ? product.thumbnailFilepath : '/images/default.png'}" alt="상품 이미지" class="w-full h-40 object-cover mb-2">
        <h3 class="text-lg font-semibold mb-1" th:text="${product.name}">상품명</h3>
        <p class="text-gray-700 mb-2">₩<span th:text="${product.price}">가격</span></p>
      </a>
    </li>
  </ul>
</section>
</body>
</html>
